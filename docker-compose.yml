services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: biolife
      POSTGRES_USER: biolife
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - biolife_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolife -d biolife"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://biolife:${POSTGRES_PASSWORD}@db:5432/biolife
      BIOLIFE_BOOTSTRAP_PASSWORD: ${BIOLIFE_BOOTSTRAP_PASSWORD:?set BIOLIFE_BOOTSTRAP_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      MINI_APP_URL: ${MINI_APP_URL:?set MINI_APP_URL}
      APP_ORIGIN: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
    ports:
      - "8787:8787"
volumes:
  biolife_pg:
